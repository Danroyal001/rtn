name: rtn_app
description: RTN self-service and admin console, built with Dartvel.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"
platforms:
  web:
  android:

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  go_router: ^14.2.0
  dio: ^5.5.0
  crypto: ^3.0.6
  dartvel_core: ^0.12.1
  dartvel_shelf: ^0.12.1
  dartvel_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0
  dartvel_cli: ^0.12.1

flutter:
  uses-material-design: true
  assets:
    - assets/

dartvel:
  org: dev.rtn
  backendHost: 127.0.0.1
  backendPort: 8740
  devBackendHost: http://localhost:8740
  prodBackendHost: http://localhost:8740
  pagesDir: lib/pages
  backendDir: lib/backend
  apiBasePath: /api
  envFiles: [.env, .env.local]
  plugins: []
  ota: false
  platforms:
    - web
    - android
  auth:
    pages: false
  admin:
    enabled: false

hooks:
  user_defines:
    dartvel_shelf:
      embed_server: true

  transitions:
    default: fade
    durationMs: 150
    curve: easeInOut

  pwa:
    name: RTN
    shortName: RTN
    icon: assets/icon.png
    themeColor: "#0F766E"
    backgroundColor: "#F7F5F2"

  splash:
    color: "#F7F5F2"
    darkColor: "#0E1414"

  seo:
    siteName: RTN
    defaultTitle: RTN
    defaultDescription: Your RTN line, balance, bundles and USSD in one place.
