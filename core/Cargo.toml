[workspace]
resolver = "2"
members = ["crates/rtn-core", "crates/rtn-api", "crates/rtn-cli", "crates/rtn-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Danroyal001/rtn"
rust-version = "1.80"

[workspace.dependencies]
rtn-core = { path = "crates/rtn-core" }
rtn-api = { path = "crates/rtn-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
parking_lot = "0.12"
rand = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
ureq = { version = "3", features = ["json"] }
proptest = "1"
criterion = { version = "0.5", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 4
